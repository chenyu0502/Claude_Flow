<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f1e9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1814" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Claude Flow：室內設計、旅遊規劃、台股分析與帳號管理的個人工作台" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      介面風格要在畫面渲染前套用，否則重新整理時會先閃一下預設的溫暖質感。
      邏輯與 src/uiStyle.ts 相同（KEY 'cf-ui-style'，合法值 warm / modern），兩邊要一起改。
    -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('cf-ui-style');
          if (s === 'warm' || s === 'modern') document.documentElement.dataset.style = s;
        } catch (e) {
          /* localStorage 無法使用時用預設風格 */
        }
      })();
    </script>
    <!-- 只載入標題用的思源宋體；內文用系統黑體，不另外下載 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
    <title>Claude Flow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
